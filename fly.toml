# fly.toml app configuration file generated for ozimage-wp-ms on 2025-12-09T12:24:21+11:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ozimage-wp-ms'
primary_region = 'syd'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
